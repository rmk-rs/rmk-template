[keyboard]
name = "{{ project_name }}"
product_name = "{{ project_name }}"
vendor_id = 0x4c4b
product_id = 0x4643
manufacturer = "RMK"
chip = "nrf52833"

[matrix]
# Row and col pins are mandatory
row_pins = ["P1_04", "P1_06", "P0_31", "P1_11"]
col_pins = ["P0_02", "P1_15", "P1_13"]
# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 4
cols = 3
map = """
(0,0)  (0,1)  (0,2)
(1,0)  (1,1)  (1,2)
(2,0)  (2,1)  (2,2)
(3,0)  (3,1)  (3,2)
"""

[keymap]
layers = 3

[[keymap.layer]] # layer 0
keys = """
A       B           C
Kc1     Kc2         Kc3
LCtrl   MO(1)       LShift
OSL(1)  LT(2, Kc9)  LM(1, LShift | LGui)
"""

[[keymap.layer]] # layer 1
keys = """
TO(1)  TT(1)  TG(2)
DF(1)  _      _
_      _      _
_      _      _
"""



[storage]
# The chip default puts storage at 400K, but a stock RMK build already uses
# ~385K of the 512K flash, leaving almost no room to grow into. Push storage to
# the last 64K instead, so the firmware has 448K before it collides with it.
start_addr = 0x70000
num_sectors = 16

[ble]
enabled = true
# vddh has an internal voltage divider
# battery_adc_pin = "vddh"
# Or
# battery_adc_pin = "P0_04"
# adc_divider_measured = 2000
# adc_divider_total = 2806

# charge_state.pin = "P0_25"
# charge_state.low_active = false
# charge_led.pin = "P0_29"
# charge_led.low_active = false
