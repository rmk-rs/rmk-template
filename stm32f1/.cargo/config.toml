[target.'cfg(all(target_arch = "arm", target_os = "none"))']
runner = "probe-rs run --chip {{ chip_name }}"
linker = "flip-link"

# Nightly-only size optimization; ignored on the stable toolchain this template
# defaults to. Rebuilding `core` with the immediate-abort panic strategy drops
# the panic formatting machinery — measured at ~4.6KB on this template.
# To use it, switch to nightly and build with:
#   RUSTFLAGS="-Zunstable-options -Cpanic=immediate-abort" cargo build --release
# (`panic = "immediate-abort"` in Cargo.toml is the other way to spell it, but
# it needs `cargo-features = ["panic-immediate-abort"]`, which stable rejects.)
[unstable]
build-std = ["core"]

[build]
# TODO: Pick ONE of these default compilation targets
# target = "thumbv6m-none-eabi"        # Cortex-M0 and Cortex-M0+
target = "thumbv7m-none-eabi"        # Cortex-M3
# target = "thumbv7em-none-eabi"       # Cortex-M4 and Cortex-M7 (no FPU)
# target = "thumbv7em-none-eabihf"     # Cortex-M4F and Cortex-M7F (with FPU)
# target = "thumbv8m.base-none-eabi"   # Cortex-M23
# target = "thumbv8m.main-none-eabi"   # Cortex-M33 (no FPU)
# target = "thumbv8m.main-none-eabihf" # Cortex-M33 (with FPU)

[env]
DEFMT_LOG = "error"
KEYBOARD_TOML_PATH =  { value = "keyboard.toml", relative = true }
