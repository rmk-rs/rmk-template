[package]
name = "{{ project_name }}"
version = "0.1.0"
authors = ["Haobo Gu <haobogu@outlook.com>"]
description = "Keyboard firmware written in Rust"
homepage = "https://github.com/rmk-rs/rmk"
repository = "https://github.com/rmk-rs/rmk"
readme = "README.md"
edition = "2021"
license = "MIT OR Apache-2.0"

[dependencies]
rmk = { version = "0.9", default-features = false, features = [
    "esp32c3_ble",
    "log",
    "split",
    "async_matrix",
    "storage",
    "vial",
] }
embassy-executor = { version = "0.10" }
esp-backtrace = { version = "0.20", features = [
    "esp32c3",
    "panic-handler",
    "println",
] }
esp-hal = { version = "1.2.0-rc.0", features = ["esp32c3", "unstable"] }
esp-storage = { version = "0.10", features = ["embedded-storage", "esp32c3"] }
esp-alloc = { version = "0.11" }
esp-println = { version = "0.18", features = ["esp32c3", "log-04"] }
esp-radio = { version = "1.0.0-beta.0", features = ["esp32c3", "unstable", "ble"] }
esp-rtos = { version = "0.4", features = ["esp32c3", "esp-radio", "embassy"] }
esp-bootloader-esp-idf = { version = "0.6", features = ["esp32c3", "log-04"] }
bt-hci = { version = "0.10" }

[build-dependencies]
xz2 = "0.1.7"
json = "0.12"
const-gen = "1.6"
embuild = "0.33"
cc = "1.2.9"

[[bin]]
name = "central"
path = "src/central.rs"
test = false
bench = false

[[bin]]
name = "peripheral"
path = "src/peripheral.rs"
test = false
bench = false

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'thin'
opt-level = 3
overflow-checks = false

[patch.crates-io]
esp-alloc = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-backtrace = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-bootloader-esp-idf = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-hal = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-println = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-radio = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-rtos = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
esp-storage = { git = "https://github.com/esp-rs/esp-hal.git", rev = "5363c4c493f5f11654696ff192028cf45f04ba72" }
